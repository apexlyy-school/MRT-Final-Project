name = "mrt-final-riftatlas-demo"
main = "worker.ts"
compatibility_date = "2025-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Run the Worker before SPA fallback so /card-image is not replaced with index.html.
run_worker_first = ["/card-image"]
